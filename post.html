<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog Post - My Personal Blog</title>
  <link rel="stylesheet" href="style.css" />
  <script src="markdown-reader.js"></script>
</head>
<body>
  <!-- Animated clouds -->
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>
  <div class="cloud cloud3"></div>
  <div class="cloud cloud4"></div>
  <div class="cloud cloud5"></div>
  <div class="cloud cloud6"></div>
  
  <!-- Sun -->
  <div class="sun"></div>
  
  <div class="layout">
    <!-- Main Content -->
    <main class="content">
      <div class="intro">
        <div class="avatar" aria-label="Profile photo">
          <img src="\images\DSC01154.jpg" alt="Antti's profile photo" style="width: 110%; height: 110%; object-fit: cover; border-radius: 50%; transform: translate(-5%, -5%); border: 3px solid #00008b;">
        </div>
        <p>Hello! I'm Antti. I live in Finland. This is my blog. 🌼☕</p>
      </div>
      
      <div class="content-box menu-box">
        <nav>
          <ul class="menu">
            <li><a href="index.html">Home</a></li>
          </ul>
        </nav>
      </div>

      <div class="content-box">
        <div id="blog-post-content">
          <p>Loading post...</p>
        </div>
      </div>
    </main>
  </div>
  
  <script
    src="markdown-reader.js">
  </script>
 
</body>
</html>
